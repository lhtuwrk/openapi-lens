name: Release ZIP on tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          EXT_VERSION="${TAG_NAME#v}"
          if [[ ! "$EXT_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Invalid tag '$TAG_NAME'. Use v1.2.3, 1.2.3, v1.2.3.4, or 1.2.3.4." >&2
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "EXT_VERSION=$EXT_VERSION" >> "$GITHUB_ENV"

      - name: Update manifest version
        run: |
          node -e "const fs=require('fs'); const p='manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.env.EXT_VERSION; fs.writeFileSync(p, JSON.stringify(m, null, '\t') + '\n');"

      - name: Create ZIP archive
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ github.ref_name }}.zip"
          git archive --format=zip --output "$ARCHIVE_NAME" HEAD
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.ARCHIVE_NAME }}
