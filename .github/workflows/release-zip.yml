name: Release ZIP on tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          EXT_VERSION="${TAG_NAME#v}"
          if [[ ! "$EXT_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Invalid tag '$TAG_NAME'. Use v1.2.3, 1.2.3, v1.2.3.4, or 1.2.3.4." >&2
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "EXT_VERSION=$EXT_VERSION" >> "$GITHUB_ENV"

      - name: Checkout master branch
        run: |
          git fetch origin master
          git checkout -B master origin/master

      - name: Update manifest version
        run: |
          node -e "const fs=require('fs'); const p='manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version=process.env.EXT_VERSION; fs.writeFileSync(p, JSON.stringify(m, null, '\t') + '\n');"

      - name: Commit manifest to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore: bump manifest version to ${EXT_VERSION}"
          git push origin HEAD:master

      - name: Create ZIP archive
        run: |
          ARCHIVE_NAME="${{ github.event.repository.name }}-${{ env.TAG_NAME }}.zip"
          git archive --format=zip --output "$ARCHIVE_NAME" HEAD
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.ARCHIVE_NAME }}
