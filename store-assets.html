<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenAPI Lens Assets Generator - Themes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <style>
    /* Base Page Styles */
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 40px; }
    h1 { text-align: center; margin-bottom: 40px; font-weight: 600; letter-spacing: -0.02em; }
    .theme-container { margin-bottom: 120px; padding-bottom: 80px; border-bottom: 1px solid #334155; }
    .theme-container:last-child { border-bottom: none; }
    .theme-header { text-align: center; margin-bottom: 50px; }
    .theme-title { font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.1em; }
    .theme-header p { color: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
    
    .tiles-wrapper { display: flex; flex-direction: column; align-items: center; gap: 60px; }
    .btn-container { text-align: center; margin-top: 24px; }
    .btn { padding: 14px 28px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 15px; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }

    /* Tile Base Styles & Variables */
    .store-tile {
      position: relative; overflow: hidden; background: var(--color-bg); color: var(--color-text-primary);
      box-sizing: border-box; font-family: var(--font-body);
    }
    .store-tile * { box-sizing: border-box; }

    /* Small Tile */
    .tile-small { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--color-border); }
    .sm-logo-box { width: 56px; height: 56px; background: var(--color-surface); border: 2px solid var(--color-border-light); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; z-index: 2; box-shadow: var(--shadow); }
    .sm-logo-box svg { width: 28px; height: 28px; fill: var(--color-text-primary); }
    .sm-seo { font-size: 12px; font-weight: 700; color: var(--color-accent); text-transform: uppercase; letter-spacing: 0.1em; z-index: 2; font-family: var(--font-body); }
    .sm-title { font-size: 42px; font-weight: 700; line-height: 1.1; margin: 8px 0; font-family: var(--font-display); z-index: 2; letter-spacing: var(--tracking-display); }
    .sm-badge { background: var(--color-surface); border: 1px solid var(--color-border); padding: 6px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--color-text-secondary); z-index: 2; }
    .sm-badge svg { width: 14px; height: 14px; stroke: var(--color-success); }
    
    /* Marquee Tile */
    .marquee-wrapper { transform: scale(0.75); transform-origin: top center; margin-bottom: -140px; }
    .tile-marquee { width: 1400px; height: 560px; display: flex; align-items: center; border: 1px solid var(--color-border); }
    .mq-glow { position: absolute; width: 800px; height: 800px; background: var(--color-accent); filter: blur(200px); opacity: var(--glow-opacity); top: -300px; right: -100px; border-radius: 50%; z-index: 0; pointer-events: none; }
    .mq-left { flex: 0 0 640px; padding-left: 100px; display: flex; flex-direction: column; z-index: 2; }
    .mq-seo-badge { display: inline-flex; align-items: center; padding: 8px 18px; background: var(--color-accent-subtle); border: 1px solid var(--color-border-light); border-radius: 99px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--color-accent); margin-bottom: 24px; width: fit-content; }
    .mq-title { font-size: 76px; font-weight: 700; line-height: 1.05; margin-bottom: 24px; font-family: var(--font-display); letter-spacing: var(--tracking-display); }
    .mq-desc { font-size: 22px; line-height: 1.6; color: var(--color-text-secondary); margin-bottom: 40px; max-width: 500px; }
    .mq-features { display: flex; flex-direction: column; gap: 20px; }
    .mq-feat { display: flex; align-items: center; gap: 16px; font-size: 18px; font-weight: 500; color: var(--color-text-secondary); }
    .mq-feat .icon { width: 28px; height: 28px; border-radius: 6px; background: var(--color-surface); border: 1px solid var(--color-border-light); display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); }
    .mq-feat .icon svg { width: 16px; height: 16px; }
    
    .mq-right { flex: 1; z-index: 2; display: flex; justify-content: center; padding-right: 60px; }
    .mockup-app { width: 700px; height: 440px; background: var(--color-surface); border: var(--mockup-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
    .mockup-header { height: 48px; background: var(--color-bg); display: flex; align-items: center; padding: 0 16px; gap: 16px; border-bottom: 1px solid var(--color-border); }
    .window-dots { display: flex; gap: 8px; }
    .window-dots div { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }
    .mockup-url-bar { flex: 1; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); height: 28px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-text-tertiary); }
    .mockup-body { flex: 1; display: flex; background: var(--color-surface); }
    .mockup-sidebar { width: 220px; border-right: 1px solid var(--color-border); padding: 24px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.8; background: var(--color-bg); }
    .mockup-main { flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 12px; }
    .endpoint-card { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .endpoint-card.active { background: var(--color-surface); border-color: var(--color-accent); box-shadow: var(--shadow); }
    .method-badge { font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 4px; min-width: 50px; text-align: center; }
    
    /* Screenshot Tile (1280x800) */
    .sc-wrapper { transform: scale(0.65); transform-origin: top center; margin-bottom: -280px; }
    .tile-screenshot { width: 1280px; height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--color-border); position: relative; padding-top: 40px; }
    .sc-glow { position: absolute; width: 1000px; height: 1000px; background: var(--color-accent); filter: blur(250px); opacity: var(--glow-opacity); top: -200px; z-index: 0; pointer-events: none; border-radius: 50%; }
    .sc-header { z-index: 2; text-align: center; margin-bottom: 70px; }
    .sc-title { font-size: 64px; font-weight: 700; margin-bottom: 24px; font-family: var(--font-display); letter-spacing: var(--tracking-display); line-height: 1.1; }
    .sc-desc { font-size: 24px; color: var(--color-text-secondary); max-width: 800px; margin: 0 auto; }
    .sc-mockup { transform: scale(1.15); z-index: 2; }

    /* Code Highlighting Variables */
    .syn-key { color: var(--color-text-secondary); }
    .syn-str { color: var(--color-success); }
    .syn-val { color: var(--color-text-primary); }
    .bg-get { background: var(--color-success-bg); color: var(--color-success); }
    .bg-post { background: var(--color-accent-subtle); color: var(--color-accent); }
    .bg-del { background: var(--color-danger-bg); color: var(--color-danger); }
    .ep-path { color: var(--color-text-primary); font-weight: 600; }
    .ep-desc { margin-left: auto; color: var(--color-text-tertiary); font-family: var(--font-body); }

    /* --- THEMES (Hallmark Design Principles) --- */
    
    .theme-modern {
      --color-bg: oklch(0.15 0.01 260); 
      --color-surface: oklch(0.18 0.01 260);
      --color-text-primary: oklch(0.98 0 0);
      --color-text-secondary: oklch(0.75 0.01 260);
      --color-text-tertiary: oklch(0.55 0.01 260);
      --color-accent: oklch(0.65 0.18 260); /* Clean Blue */
      --color-accent-subtle: oklch(0.65 0.18 260 / 0.15);
      --color-border: oklch(0.25 0.01 260);
      --color-border-light: oklch(0.32 0.01 260);
      --color-success: oklch(0.70 0.15 160); --color-success-bg: oklch(0.25 0.05 160);
      --color-danger: oklch(0.65 0.15 20); --color-danger-bg: oklch(0.25 0.05 20);
      --font-display: 'Inter', sans-serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 6px; --radius-md: 12px; --radius-lg: 12px;
      --mockup-border: 1px solid var(--color-border-light);
      --shadow: 0 8px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 24px 80px rgba(0,0,0,0.5);
      --glow-opacity: 0.15;
      --tracking-display: -0.04em;
    }

    .theme-editorial {
      --color-bg: oklch(0.98 0 0); 
      --color-surface: oklch(0.96 0 0);
      --color-text-primary: oklch(0.15 0 0);
      --color-text-secondary: oklch(0.40 0 0);
      --color-text-tertiary: oklch(0.60 0 0);
      --color-accent: oklch(0.45 0.15 20); /* Rust */
      --color-accent-subtle: oklch(0.45 0.15 20 / 0.1);
      --color-border: oklch(0.90 0 0);
      --color-border-light: oklch(0.85 0 0);
      --color-success: oklch(0.45 0.15 160); --color-success-bg: oklch(0.45 0.15 160 / 0.1);
      --color-danger: oklch(0.50 0.20 20); --color-danger-bg: oklch(0.50 0.20 20 / 0.1);
      --font-display: 'Playfair Display', serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 0px; --radius-md: 0px; --radius-lg: 0px;
      --mockup-border: 1px solid var(--color-border-light);
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
      --shadow-lg: 0 30px 60px rgba(0,0,0,0.08);
      --glow-opacity: 0.05;
      --tracking-display: -0.02em;
    }

    .theme-atmospheric {
      --color-bg: oklch(0.12 0.02 300); 
      --color-surface: oklch(0.16 0.03 300);
      --color-text-primary: oklch(0.98 0 0);
      --color-text-secondary: oklch(0.7 0.05 300);
      --color-text-tertiary: oklch(0.5 0.05 300);
      --color-accent: oklch(0.70 0.2 320); /* Neon Pink */
      --color-accent-subtle: oklch(0.70 0.2 320 / 0.15);
      --color-border: oklch(0.20 0.03 300);
      --color-border-light: oklch(0.25 0.03 300);
      --color-success: oklch(0.70 0.15 160); --color-success-bg: oklch(0.25 0.05 160);
      --color-danger: oklch(0.65 0.15 20); --color-danger-bg: oklch(0.25 0.05 20);
      --font-display: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 12px; --radius-md: 24px; --radius-lg: 24px;
      --mockup-border: 1px solid var(--color-border-light);
      --shadow: 0 0 40px var(--color-accent-subtle);
      --shadow-lg: 0 0 100px var(--color-accent-subtle);
      --glow-opacity: 0.3;
      --tracking-display: -0.02em;
    }

    .theme-brutalist {
      --color-bg: oklch(0.92 0.15 100); /* Yellow */
      --color-surface: oklch(1 0 0); /* White */
      --color-text-primary: oklch(0.05 0 0); 
      --color-text-secondary: oklch(0.25 0 0);
      --color-text-tertiary: oklch(0.40 0 0);
      --color-accent: oklch(0.45 0.2 260); /* Deep Blue */
      --color-accent-subtle: oklch(1 0 0);
      --color-border: oklch(0.05 0 0);
      --color-border-light: oklch(0.05 0 0);
      --color-success: oklch(0.05 0 0); --color-success-bg: oklch(0.8 0.15 160);
      --color-danger: oklch(0.05 0 0); --color-danger-bg: oklch(0.7 0.15 20);
      --font-display: 'JetBrains Mono', monospace; --font-body: 'JetBrains Mono', monospace;
      --radius-sm: 0px; --radius-md: 0px; --radius-lg: 0px;
      --mockup-border: 4px solid var(--color-border);
      --shadow: 6px 6px 0 var(--color-border);
      --shadow-lg: 16px 16px 0 var(--color-border);
      --glow-opacity: 0;
      --tracking-display: -0.05em;
    }
    
    /* Brutalist specific overrides */
    .theme-brutalist .store-tile { border: 4px solid var(--color-border); }
    .theme-brutalist .sm-logo-box { border: 4px solid var(--color-border); box-shadow: 6px 6px 0 var(--color-border); }
    .theme-brutalist .sm-badge { border: 2px solid var(--color-border); box-shadow: 4px 4px 0 var(--color-border); font-weight: 800; }
    .theme-brutalist .mq-seo-badge { border: 3px solid var(--color-border); box-shadow: 4px 4px 0 var(--color-border); font-weight: 800; background: oklch(1 0 0); }
    .theme-brutalist .mq-feat .icon { border: 2px solid var(--color-border); box-shadow: 2px 2px 0 var(--color-border); }
    .theme-brutalist .mockup-header { border-bottom: 4px solid var(--color-border); }
    .theme-brutalist .mockup-sidebar { border-right: 4px solid var(--color-border); }
    .theme-brutalist .endpoint-card { border: 2px solid var(--color-border); box-shadow: 4px 4px 0 var(--color-border); }
    .theme-brutalist .endpoint-card.active { transform: translate(-4px, -4px); box-shadow: 8px 8px 0 var(--color-accent); border-color: var(--color-accent); }
    .theme-brutalist .method-badge { border: 2px solid var(--color-border); }
    .theme-brutalist .mockup-url-bar { border: 2px solid var(--color-border); }
    .theme-brutalist .tile-screenshot { border: 4px solid var(--color-border); }
    .theme-brutalist .syn-str { color: oklch(0.4 0.15 160); font-weight: bold; }
    
    .theme-technical {
      --color-bg: oklch(0.1 0 0);
      --color-surface: oklch(0.15 0 0);
      --color-text-primary: oklch(0.85 0.15 150);
      --color-text-secondary: oklch(0.6 0.1 150);
      --color-text-tertiary: oklch(0.4 0.05 150);
      --color-accent: oklch(0.9 0.2 150);
      --color-accent-subtle: oklch(0.9 0.2 150 / 0.1);
      --color-border: oklch(0.3 0.1 150);
      --color-border-light: oklch(0.2 0.05 150);
      --color-success: oklch(0.9 0.2 150); --color-success-bg: oklch(0.9 0.2 150 / 0.1);
      --color-danger: oklch(0.7 0.2 20); --color-danger-bg: oklch(0.7 0.2 20 / 0.1);
      --font-display: 'JetBrains Mono', monospace; --font-body: 'JetBrains Mono', monospace;
      --radius-sm: 0px; --radius-md: 0px; --radius-lg: 0px;
      --mockup-border: 1px solid var(--color-accent);
      --shadow: 0 0 10px var(--color-accent-subtle);
      --shadow-lg: 0 0 20px var(--color-accent-subtle);
      --glow-opacity: 0.1;
      --tracking-display: 0;
    }
    .theme-technical .store-tile { background-image: radial-gradient(var(--color-border) 1px, transparent 1px); background-size: 20px 20px; }

    .theme-luxury {
      --color-bg: oklch(0.12 0 0);
      --color-surface: oklch(0.18 0 0);
      --color-text-primary: oklch(0.95 0.02 80);
      --color-text-secondary: oklch(0.7 0.02 80);
      --color-text-tertiary: oklch(0.5 0.02 80);
      --color-accent: oklch(0.75 0.12 80);
      --color-accent-subtle: oklch(0.75 0.12 80 / 0.1);
      --color-border: oklch(0.25 0.01 80);
      --color-border-light: oklch(0.20 0.01 80);
      --color-success: oklch(0.75 0.12 80); --color-success-bg: oklch(0.75 0.12 80 / 0.1);
      --color-danger: oklch(0.6 0.15 20); --color-danger-bg: oklch(0.6 0.15 20 / 0.1);
      --font-display: 'Playfair Display', serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px;
      --mockup-border: 1px solid var(--color-accent);
      --shadow: 0 10px 40px rgba(0,0,0,0.5);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
      --glow-opacity: 0.05;
      --tracking-display: 0;
    }

    .theme-soft {
      --color-bg: oklch(0.97 0.01 250); 
      --color-surface: oklch(1 0 0);
      --color-text-primary: oklch(0.2 0 0);
      --color-text-secondary: oklch(0.4 0 0);
      --color-text-tertiary: oklch(0.6 0 0);
      --color-accent: oklch(0.7 0.12 300);
      --color-accent-subtle: oklch(0.7 0.12 300 / 0.1);
      --color-border: oklch(0.9 0.02 250);
      --color-border-light: oklch(0.95 0.01 250);
      --color-success: oklch(0.6 0.15 160); --color-success-bg: oklch(0.6 0.15 160 / 0.1);
      --color-danger: oklch(0.6 0.15 20); --color-danger-bg: oklch(0.6 0.15 20 / 0.1);
      --font-display: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
      --radius-sm: 16px; --radius-md: 24px; --radius-lg: 32px;
      --mockup-border: 1px solid var(--color-border);
      --shadow: 0 12px 32px rgba(100, 110, 140, 0.08);
      --shadow-lg: 0 24px 64px rgba(100, 110, 140, 0.12);
      --glow-opacity: 0.2;
      --tracking-display: -0.02em;
    }
  </style>
</head>

  <h1>OpenAPI Lens - Chrome Store Assets</h1>

  <div id="themes-root"></div>

  <script>
    const themes = [
      { id: 'modern', name: 'Modern Minimal', class: 'theme-modern', desc: 'Dark, electric blue accents, sleek borders. Classic dev-tool look.' },
      { id: 'editorial', name: 'Editorial', class: 'theme-editorial', desc: 'Light, high contrast, elegant serif headers (Playfair Display). Trustworthy and clean.' },

      { id: 'soft', name: 'Soft Pastel', class: 'theme-soft', desc: 'Warm off-white, soft lavender/peach accents, rounded corners. Playful.' }

    const iconCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    const mockupHTML = (extraClass = "") => `
      <div class="mockup-app ${extraClass}">

          <div class="window-dots">
            <div style="background:oklch(0.6 0.15 20)"></div>

          </div>
          <div class="mockup-url-bar">api.example.com/v3/openapi.json</div>

            <span class="syn-key">paths:</span><br>

    // Fix for the copy bug: Force a direct download fallback using standard anchor clicking.
    // Clipboard API fails on `file://` scheme because it is insecure.
    async function downloadImage(id, btn) {
      const el = document.getElementById(id);
      if(!el) return;
      
      const originalText = btn.innerText;
      btn.innerText = "Processing...";
      
      // FIX CROP ISSUE: Use html-to-image which natively handles scales and high-DPI displays flawlessly!
      try {
        const dataUrl = await htmlToImage.toPng(el, {
          pixelRatio: 2
        });
        
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        
        try {
          // Attempt to copy to clipboard first
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          btn.innerText = "✓ Copied!";
        } catch (copyErr) {
          console.log('Clipboard blocked by Chrome (file://), falling back to download...', copyErr);
          // Trigger download fallback
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = `openapi-lens-${id}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          btn.innerText = "✓ Downloaded!";
        }
        
        setTimeout(() => btn.innerText = originalText, 2500);
      } catch(e) {
        console.error(e);
        btn.innerText = "Error (See console)";
        setTimeout(() => btn.innerText = originalText, 2500);
      }
    }
  </script>
